<ActionBar title="Productos"></ActionBar>

<ScrollView>
  <StackLayout class="page__content">

    <Image
      src="~/App_Resources/images/productos.png"
      stretch="aspectFit"
      height="220">
    </Image>

    <Label
      text="Nuestros productos"
      class="h1 text-center">
    </Label>

    <Label
      text="Conoce nuestros productos y descubre las mejores opciones para ti."
      textWrap="true"
      class="body text-center">
    </Label>

    <Button
      text="Ver productos"
      class="btn btn-primary"
      (tap)="onViewProducts()">
    </Button>

    <Label
      text="Productos para leer ahora"
      class="h2 text-center m-t-20">
    </Label>

    <ListView [items]="productosLeidos$ | async">

      <ng-template let-producto="item">

        <StackLayout class="p-10">

          <Label
            [text]="producto.nombre"
            class="h3">
          </Label>

          <Label
            [text]="producto.descripcion"
            textWrap="true">
          </Label>

          <Label
            [text]="'$' + producto.precio"
            class="h4">
          </Label>

        </StackLayout>

      </ng-template>

    </ListView>

  </StackLayout>
</ScrollView>
